name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sh tools/check.sh
      - name: known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
